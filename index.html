<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Information and support for our games.">
  <title>Our Games</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11131d; color: #f7f5ef; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(680px, calc(100% - 40px)); padding: 42px 0; }
    h1 { color: #ffad42; font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 12px; }
    p { color: #d4d7e2; line-height: 1.7; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 28px; }
    a { color: #7ce1df; }
    footer { color: #aeb3c3; margin-top: 48px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Our Games</h1>
    <p>Our game is a portrait merge-puzzle. Combine matching tiles, build your score, and compare personal-best scores on the online leaderboard.</p>
    <p>For game support, use the developer contact email shown on the game's Google Play listing.</p>
    <nav aria-label="Information">
      <a href="/privacy">Privacy Policy</a>
    </nav>
    <footer>© 2026</footer>
  </main>
</body>
</html>
